name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mlops-parity-tests:
    name: Model Eğitimi, Eval Gate ve Diferansiyel Parite Testleri
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn==1.6.1 pandas joblib skl2onnx onnx onnxruntime

      - name: Model Eğitimi & Eval Kapısı (train.py)
        run: python train.py --veri data/oturumlar.csv --cikis model

      - name: Python Oracle Diferansiyel Parite Testi (parite.py)
        run: python tests/parite.py

      - name: Birim Testleri Çalıştır (unittest)
        run: python -m unittest discover -s tests -v
