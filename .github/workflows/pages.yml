# web/ klasörünü GitHub Pages'e yayınlar (The Primer v2 Canlı Demo)
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: GitHub Pages Yapılandırması
        uses: actions/configure-pages@v5

      - name: Web Artefaktını Yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: GitHub Pages'e Dağıt
        id: deployment
        uses: actions/deploy-pages@v4
